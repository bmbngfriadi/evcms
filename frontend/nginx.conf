server {
    listen 80;
    server_name localhost;

    # Backend API reverse proxy
    location /evcms/api/ {
        proxy_pass http://evcms-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Handle file uploads max size
        client_max_body_size 10M;
    }

    # Serve uploads from backend
    location /evcms/uploads/ {
        proxy_pass http://evcms-backend:3000/evcms/uploads/;
    }

    # Serve static files for frontend
    location /evcms/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /evcms/index.html;
    }

    # Redirect /evcms to /evcms/
    location = /evcms {
        return 301 /evcms/;
    }

    # Redirect root to /evcms/
    location = / {
        return 301 /evcms/;
    }
}
